name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/macmaster \
            target/aarch64-apple-darwin/release/macmaster \
            target/x86_64-apple-darwin/release/macmaster
          lipo -info dist/macmaster
          cd dist && shasum -a 256 macmaster > macmaster.sha256
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/macmaster
            dist/macmaster.sha256
          generate_release_notes: true
