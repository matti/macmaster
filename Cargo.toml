[package]
name = "macmaster"
version = "0.1.0"
edition = "2024"
description = "Zero-config: one command applies opinionated macOS settings"
repository = "https://github.com/matti/macmaster"
publish = false

[lib]
doctest = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFPreferences", "CFNumber", "CFString"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
